version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (security patches for the runners' actions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # codeql-action init/analyze/upload-sarif must move in lockstep — split PRs fail each other's checks.
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Keep npm dependencies current / flag vulnerable versions.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
